name: AgentCash Preflight Index Recheck

on:
  push:
    branches:
      - agentcash-preflight-audit-20260722
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for async indexing
        run: sleep 90

      - name: Recheck AgentCash search
        shell: bash
        run: |
          mkdir -p audit
          date -u +'%Y-%m-%dT%H:%M:%SZ' > audit/timestamp.txt
          set +e
          for pair in \
            'exact|Agent Preflight' \
            'domain|preflight.lorensaisolutions.com' \
            'url-inspection|inspect an unfamiliar URL before browser automation' \
            'access-barriers|detect login wall captcha browser restrictions' \
            'api-discovery|discover website API structured data' \
            'product-intel|analyze product URL price availability' \
            'change-check|compare webpage changes monitor URL'; do
            name="${pair%%|*}"
            query="${pair#*|}"
            npx -y agentcash@latest --format json search "$query" > "audit/search-$name.json" 2>&1
            echo "$?" > "audit/search-$name.exit"
          done
          set -e

      - name: Upload recheck results
        uses: actions/upload-artifact@v4
        with:
          name: agentcash-preflight-index-recheck
          path: audit/
          if-no-files-found: error
          retention-days: 7
