name: AgentCash Visibility Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Search AgentCash index
        shell: bash
        run: |
          mkdir -p results
          date -u +'%Y-%m-%dT%H:%M:%SZ' > results/timestamp.txt
          set +e
          for pair in \
            'name|Agent Preflight' \
            'domain|preflight.lorensaisolutions.com' \
            'inspect|inspect an unfamiliar URL before browser automation' \
            'access|detect login wall captcha browser restrictions' \
            'api|discover website API structured data' \
            'product|analyze product URL price availability' \
            'change|compare webpage changes monitor URL' \
            'batch|inspect multiple URLs for an agent swarm'; do
            key="${pair%%|*}"
            query="${pair#*|}"
            npx -y agentcash@latest --format json search "$query" > "results/$key.json" 2>&1
            echo "$?" > "results/$key.exit"
          done
          set -e

      - name: Direct discovery check
        shell: bash
        run: |
          set +e
          npx -y @agentcash/discovery@latest discover https://preflight.lorensaisolutions.com > results/direct-discovery.txt 2>&1
          echo "$?" > results/direct-discovery.exit
          set -e

      - uses: actions/upload-artifact@v4
        with:
          name: agentcash-visibility-results
          path: results/
          retention-days: 3
